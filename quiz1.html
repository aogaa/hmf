<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz 1 – Hva er gjenstanden? | Historiequiz</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="logos">
      <img src="images/HMFLogo.png" alt="Holmestrand Museum">
      <img src="images/BotneLogo.png" alt="Botne Historielag">
    </div>
    <div class="site-title">Historiequiz</div>
  </header>

  <div class="quiz-header">
    <div class="quiz-header-bg" style="background-image:url('images/6.jpg')"></div>
    <h1>Quiz 1 — Hva er gjenstanden?</h1>
    <p>Se på den nummererte gjenstanden på bordet og velg hva du tror det er.</p>
  </div>

  <div class="quiz-form-wrapper">
    <a href="index.html" class="tilbake">← Tilbake til forsiden</a>

    <div id="feil" class="alert alert-feil" style="display:none;"></div>

    <form id="quiz-skjema">
      <div id="svar-liste">
        <!-- Genereres av JavaScript -->
      </div>
      <div class="send-knapp-wrapper">
        <button type="submit" class="btn btn-primær" style="max-width:300px;">Send inn svar</button>
      </div>
    </form>

    <div class="bekreftelse" id="bekreftelse">
      <div class="bekreftelse-ikon">🎉</div>
      <h2>Svar mottatt!</h2>
      <p>Takk for at du deltok i Quiz 1.</p>
      <div class="ornament">✦ ✦ ✦</div>
      <div id="neste-valg" class="neste-valg"></div>
    </div>
  </div>

  <footer>
    <p>© 2026 Holmestrand Museum &amp; Botne Historielag</p>
  </footer>

  <script type="module">
    import { quiz1 } from './js/content.js';
    import { krevRegistrering } from './js/auth.js';
    import { sendInnSvar, sjekkOgVisStatus, visNesteQuizValg } from './js/quiz.js';

    krevRegistrering();

    const liste = document.getElementById('svar-liste');
    quiz1.forEach(q => {
      const alternativer = Object.entries(q.alternativer).map(([bokstav, tekst]) => `
        <label class="mc-alternativ">
          <input type="radio" name="q${q.id}" value="${bokstav}">
          <span class="mc-bokstav">${bokstav}</span>
          <span class="mc-tekst">${tekst}</span>
        </label>`).join('');
      liste.innerHTML += `
        <div class="mc-rad">
          <div class="mc-spørsmål"><span class="nr">${q.id}</span> ${q.spørsmål}</div>
          <div class="mc-alternativer">${alternativer}</div>
        </div>`;
    });

    const skjema = document.getElementById('quiz-skjema');
    const bekreftelse = document.getElementById('bekreftelse');

    await sjekkOgVisStatus(1, skjema, bekreftelse);

    skjema.addEventListener('submit', async e => {
      e.preventDefault();
      const feilEl = document.getElementById('feil');
      feilEl.style.display = 'none';

      const data = new FormData(skjema);
      const svar = {};
      quiz1.forEach(q => { svar[`q${q.id}`] = data.get(`q${q.id}`)?.trim() || ''; });

      const knapp = skjema.querySelector('button[type="submit"]');
      knapp.disabled = true;
      knapp.innerHTML = '<span class="spinner"></span> Sender…';

      try {
        const res = await sendInnSvar(1, svar);
        skjema.style.display = 'none';
        bekreftelse.classList.add('vis');
        await visNesteQuizValg(1);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } catch (err) {
        feilEl.textContent = 'Noe gikk galt. Prøv igjen.';
        feilEl.style.display = 'block';
        knapp.disabled = false;
        knapp.textContent = 'Send inn svar';
      }
    });
  </script>
</body>
</html>
